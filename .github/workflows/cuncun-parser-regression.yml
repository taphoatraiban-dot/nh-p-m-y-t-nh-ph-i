name: CUNCUN parser regression guard
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check tests/helpers/production-parser.cjs
      - name: Existing parser regression suite
        run: node --test tests/*.test.cjs
