name: Parser regression
on:
  push:
    paths:
      - 'index.html'
      - 'tests/**'
      - 'src/**'
      - 'scripts/build-reconcile-preview.cjs'
      - 'doi-soat-thu.html'
      - '.github/workflows/parser-regression.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - 'src/**'
      - 'scripts/build-reconcile-preview.cjs'
      - 'doi-soat-thu.html'
      - '.github/workflows/parser-regression.yml'
  workflow_dispatch:
jobs:
  parser-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Node
        run: node --version
      - name: Verify pure normalization rules
        run: node --test tests/parser-regression.cjs tests/telegram-reconcile.test.cjs tests/telegram-region.test.cjs tests/parser-money.test.cjs tests/reconcile-preview.test.cjs tests/login-startup.test.cjs tests/pin-unlock.test.cjs
