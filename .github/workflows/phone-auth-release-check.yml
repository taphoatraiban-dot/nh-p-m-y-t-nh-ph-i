name: Phone auth release guardrails
on:
  push:
    branches:
      - release/phone-password-safe-20261102
    paths:
      - 'experiments/phone-password/**'
      - '.github/workflows/phone-auth-release-check.yml'
  pull_request:
    paths:
      - 'experiments/phone-password/**'
      - '.github/workflows/phone-auth-release-check.yml'
permissions:
  contents: read
jobs:
  security-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check phone auth security invariants
        run: node --test experiments/phone-password/edge-security-regression.test.mjs
