name: Phone password staging checks
on:
  push:
    branches:
      - feature/phone-password-registration-isolated-20261102
    paths:
      - 'experiments/phone-password/**'
      - '.github/workflows/phone-password-staging.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install staging dependencies
        working-directory: experiments/phone-password
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Check server syntax
        run: node --check experiments/phone-password/staging-server.mjs
      - name: Verify server refuses startup without staging configuration
        run: |
          if env -u SUPABASE_URL -u SUPABASE_PUBLISHABLE_KEY -u PHONE_ALIAS_SECRET -u STAGING_ONLY node experiments/phone-password/staging-server.mjs; then
            echo 'ERROR: staging server started without required environment' >&2
            exit 1
          fi
      - name: Run SMS-free phone tests
        run: node --test experiments/phone-password/*.test.mjs
