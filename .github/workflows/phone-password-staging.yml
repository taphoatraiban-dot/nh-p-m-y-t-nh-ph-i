name: Phone password staging checks
on:
  push:
    branches:
      - feature/phone-password-registration-isolated-20261102
    paths:
      - 'experiments/phone-password/**'
      - '.github/workflows/phone-password-staging.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install staging dependencies
        working-directory: experiments/phone-password
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Check server syntax
        run: node --check experiments/phone-password/staging-server.mjs
      - name: Verify server refuses startup without staging configuration
        run: |
          if env -u SUPABASE_URL -u SUPABASE_PUBLISHABLE_KEY -u PHONE_ALIAS_SECRET -u STAGING_ONLY node experiments/phone-password/staging-server.mjs; then
            echo 'ERROR: staging server started without required environment' >&2
            exit 1
          fi
      - name: Run HTTP security smoke checks on localhost
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY: local-ci-test-only-not-a-real-key
          PHONE_ALIAS_SECRET: local-ci-alias-secret-with-at-least-32-characters
          STAGING_ONLY: 'true'
          PORT: '8787'
        run: |
          node experiments/phone-password/staging-server.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/ >/dev/null; then break; fi
            sleep 1
          done
          node experiments/phone-password/staging-http-smoke.mjs
      - name: Run SMS-free phone tests
        run: node --test experiments/phone-password/*.test.mjs
