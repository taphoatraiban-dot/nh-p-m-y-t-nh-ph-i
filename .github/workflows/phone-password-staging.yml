name: Phone password staging checks
on:
  push:
    branches:
      - feature/phone-password-registration-isolated-20261102
    paths:
      - 'experiments/phone-password/**'
      - '.github/workflows/phone-password-staging.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server syntax
        run: node --check experiments/phone-password/staging-server.mjs
      - name: Run SMS-free phone tests
        run: node --test experiments/phone-password/*.test.mjs
