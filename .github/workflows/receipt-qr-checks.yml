name: Receipt QR checks
on:
  push:
    branches:
      - feature/receipt-qr-one-time-20261028
  pull_request:
    paths:
      - 'src/ios-share-phoi.js'
      - 'src/receipt-qr.js'
      - 'tests/receipt-qr.test.cjs'
      - '.github/workflows/receipt-qr-checks.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/ios-share-phoi.js
          node --check src/receipt-qr.js
      - name: Unit tests
        run: node --test tests/receipt-qr.test.cjs
