name: Telegram private regression
on:
  pull_request:
    paths:
      - 'telegram/tenant_worker.py'
      - 'tests/test_telegram_private.py'
      - '.github/workflows/telegram-private-tests.yml'
  workflow_dispatch:
jobs:
  private-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile worker
        run: python -m py_compile telegram/tenant_worker.py
      - name: Run private-message regression tests
        run: python -m unittest discover -s tests -p 'test_telegram_private.py' -v
