<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1340" viewBox="0 0 900 1340"><rect width="900" height="1340" fill="#f1f5f9"/><rect x="16" y="16" width="868" height="112" rx="18" fill="#c91f2e"/><text x="450" y="64" fill="white" text-anchor="middle" font-size="32" font-weight="bold" font-family="Arial,sans-serif">HƯỚNG DẪN KẾT NỐI TELEGRAM</text><text x="450" y="97" fill="white" text-anchor="middle" font-size="20" font-family="Arial,sans-serif">ÔNG THẦN TÀI • Dành cho tài khoản khách hàng</text><g font-family="Arial,sans-serif"><rect x="16" y="148" width="426" height="256" rx="16" fill="white" stroke="#d4deea" stroke-width="2"/><rect x="16" y="148" width="426" height="58" rx="16" fill="#1769ce"/><rect x="16" y="190" width="426" height="16" fill="#1769ce"/><circle cx="51" cy="177" r="23" fill="white"/><text x="51" y="186" text-anchor="middle" font-size="26" font-weight="bold" fill="#1769ce">1</text><text x="86" y="186" font-size="19" font-weight="bold" fill="white">TẠO BOT TELEGRAM</text><rect x="33" y="226" width="392" height="151" rx="12" fill="#eef5ff"/><text x="44" y="273" font-size="18" fill="#172b4d">Mở Telegram → tìm @BotFather</text><text x="44" y="314" font-size="18" fill="#172b4d">Nhắn /newbot để bắt đầu tạo bot.</text><path d="M46 343h320" stroke="#a4c4ed" stroke-width="2"/></rect><rect x="458" y="148" width="426" height="256" rx="16" fill="white" stroke="#d4deea" stroke-width="2"/><rect x="458" y="148" width="426" height="58" rx="16" fill="#1769ce"/><rect x="458" y="190" width="426" height="16" fill="#1769ce"/><circle cx="493" cy="177" r="23" fill="white"/><text x="493" y="186" text-anchor="middle" font-size="26" font-weight="bold" fill="#1769ce">2</text><text x="528" y="186" font-size="19" font-weight="bold" fill="white">ĐẶT TÊN VÀ USERNAME</text><rect x="475" y="226" width="392" height="151" rx="12" fill="#eef5ff"/><text x="486" y="273" font-size="18" fill="#172b4d">Nhập tên bot tuỳ ý.</text><text x="486" y="314" font-size="18" fill="#172b4d">Username phải kết thúc bằng bot.</text><path d="M488 343h320" stroke="#a4c4ed" stroke-width="2"/></rect><rect x="16" y="422" width="426" height="256" rx="16" fill="white" stroke="#d4deea" stroke-width="2"/><rect x="16" y="422" width="426" height="58" rx="16" fill="#1769ce"/><rect x="16" y="464" width="426" height="16" fill="#1769ce"/><circle cx="51" cy="451" r="23" fill="white"/><text x="51" y="460" text-anchor="middle" font-size="26" font-weight="bold" fill="#1769ce">3</text><text x="86" y="460" font-size="19" font-weight="bold" fill="white">SAO CHÉP TOKEN</text><rect x="33" y="500" width="392" height="151" rx="12" fill="#eef5ff"/><text x="44" y="547" font-size="18" fill="#172b4d">BotFather gửi mã token của bot.</text><text x="44" y="588" font-size="18" fill="#172b4d">Sao chép và giữ kín mã này.</text><path d="M46 617h320" stroke="#a4c4ed" stroke-width="2"/></rect><rect x="458" y="422" width="426" height="256" rx="16" fill="white" stroke="#d4deea" stroke-width="2"/><rect x="458" y="422" width="426" height="58" rx="16" fill="#1769ce"/><rect x="458" y="464" width="426" height="16" fill="#1769ce"/><circle cx="493" cy="451" r="23" fill="white"/><text x="493" y="460" text-anchor="middle" font-size="26" font-weight="bold" fill="#1769ce">4</text><text x="528" y="460" font-size="19" font-weight="bold" fill="white">ĐĂNG NHẬP PHẦN MỀM</text><rect x="475" y="500" width="392" height="151" rx="12" fill="#eef5ff"/><text x="486" y="547" font-size="18" fill="#172b4d">Mở https://cuncun.icu</text><text x="486" y="588" font-size="18" fill="#172b4d">Đăng nhập tài khoản đã được cấp quyền.</text><path d="M488 617h320" stroke="#a4c4ed" stroke-width="2"/></rect><rect x="16" y="696" width="426" height="256" rx="16" fill="white" stroke="#d4deea" stroke-width="2"/><rect x="16" y="696" width="426" height="58" rx="16" fill="#1769ce"/><rect x="16" y="738" width="426" height="16" fill="#1769ce"/><circle cx="51" cy="725" r="23" fill="white"/><text x="51" y="734" text-anchor="middle" font-size="26" font-weight="bold" fill="#1769ce">5</text><text x="86" y="734" font-size="19" font-weight="bold" fill="white">KẾT NỐI BOT CỦA TÔI</text><rect x="33" y="774" width="392" height="151" rx="12" fill="#eef5ff"/><text x="44" y="821" font-size="18" fill="#172b4d">Mở Tin Telegram → Kết nối Telegram của tôi.</text><text x="44" y="862" font-size="18" fill="#172b4d">Dán token và bấm Kết nối bot của tôi.</text><path d="M46 891h320" stroke="#a4c4ed" stroke-width="2"/></rect><rect x="458" y="696" width="426" height="256" rx="16" fill="white" stroke="#d4deea" stroke-width="2"/><rect x="458" y="696" width="426" height="58" rx="16" fill="#1769ce"/><rect x="458" y="738" width="426" height="16" fill="#1769ce"/><circle cx="493" cy="725" r="23" fill="white"/><text x="493" y="734" text-anchor="middle" font-size="26" font-weight="bold" fill="#1769ce">6</text><text x="528" y="734" font-size="19" font-weight="bold" fill="white">GỬI VÀ NHẬN TIN</text><rect x="475" y="774" width="392" height="151" rx="12" fill="#eef5ff"/><text x="486" y="821" font-size="18" fill="#172b4d">Mở bot vừa tạo, nhấn Start.</text><text x="486" y="862" font-size="18" fill="#172b4d">Gửi hoặc chuyển tiếp tin nhắn cho bot.</text><path d="M488 891h320" stroke="#a4c4ed" stroke-width="2"/></rect><rect x="16" y="970" width="426" height="256" rx="16" fill="white" stroke="#d4deea" stroke-width="2"/><rect x="16" y="970" width="426" height="58" rx="16" fill="#1769ce"/><rect x="16" y="1012" width="426" height="16" fill="#1769ce"/><circle cx="51" cy="999" r="23" fill="white"/><text x="51" y="1008" text-anchor="middle" font-size="26" font-weight="bold" fill="#1769ce">7</text><text x="86" y="1008" font-size="19" font-weight="bold" fill="white">CHỌN TIN ĐỂ TÍNH</text><rect x="33" y="1048" width="392" height="151" rx="12" fill="#eef5ff"/><text x="44" y="1095" font-size="18" fill="#172b4d">Lọc nhóm → tích chọn các tin cần dùng.</text><text x="44" y="1136" font-size="18" fill="#172b4d">Bấm ĐƯA TIN ĐÃ CHỌN VÀO Ô TÍNH.</text><path d="M46 1165h320" stroke="#a4c4ed" stroke-width="2"/></rect><rect x="458" y="970" width="426" height="256" rx="16" fill="white" stroke="#d4deea" stroke-width="2"/><rect x="458" y="970" width="426" height="58" rx="16" fill="#1769ce"/><rect x="458" y="1012" width="426" height="16" fill="#1769ce"/><circle cx="493" cy="999" r="23" fill="white"/><text x="493" y="1008" text-anchor="middle" font-size="26" font-weight="bold" fill="#1769ce">8</text><text x="528" y="1008" font-size="19" font-weight="bold" fill="white">QUẢN LÝ TIN VÀ BOT</text><rect x="475" y="1048" width="392" height="151" rx="12" fill="#eef5ff"/><text x="486" y="1095" font-size="18" fill="#172b4d">Xoá từng tin hoặc các tin đã chọn.</text><text x="486" y="1136" font-size="18" fill="#172b4d">Ngắt bot khi không sử dụng; tin cũ vẫn lưu.</text><path d="M488 1165h320" stroke="#a4c4ed" stroke-width="2"/></rect></g><rect x="16" y="1254" width="868" height="68" rx="12" fill="#e2f2e8"/><text x="450" y="1282" text-anchor="middle" font-size="21" font-weight="bold" fill="#146a3e" font-family="Arial,sans-serif">MỖI TÀI KHOẢN CÓ HỘP TIN RIÊNG</text><text x="450" y="1308" text-anchor="middle" font-size="17" fill="#146a3e" font-family="Arial,sans-serif">Không chia sẻ token • Không tự động xoá tin đã lưu</text></svg>