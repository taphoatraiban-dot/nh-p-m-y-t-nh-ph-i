<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuncun — Duyệt tài khoản SĐT</title><style>body{font:16px system-ui;background:#f3f4f6;color:#111827;margin:0;padding:16px}main{max-width:760px;margin:24px auto;background:white;padding:22px;border-radius:16px;border:1px solid #ddd}input,button,select{font:inherit;padding:11px;border-radius:8px;border:1px solid #bbb}input{box-sizing:border-box;width:100%;margin:5px 0 12px}button{cursor:pointer;background:#171717;color:white;margin:4px}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e5e7eb;color:#111}article{border:1px solid #ddd;border-radius:10px;padding:12px;margin:12px 0;overflow-wrap:anywhere}small{color:#555}#status{white-space:pre-wrap;min-height:24px}</style></head><body><main><h1>Quản lý đăng ký SĐT</h1><p>Chỉ Admin hiện tại được duyệt, từ chối hoặc thu hồi bản quyền. Không gửi SMS.</p><p><strong>Bản kiểm thử:</strong> chỉ dùng trên nhánh phát hành; chưa mở công khai.</p><form id="adminLogin"><label>Email Admin<input id="email" type="email" autocomplete="username" required></label><label>Mật khẩu<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">ĐĂNG NHẬP ADMIN</button></form><section id="dashboard" hidden><button id="refresh" type="button">TẢI DANH SÁCH</button><button id="logout" class="secondary" type="button">ĐĂNG XUẤT</button><div id="accounts"></div></section><p id="status" role="status" aria-live="polite"></p><a href="/">Quay lại phần mềm</a></main><script>
'use strict';
// Release gate: configure only after backend + RLS + integration testing pass.
const API_URL='https://zigpqddlhvjbjrwhfhaa.supabase.co/functions/v1/phone-password-auth';
let accessToken='';
const $=id=>document.getElementById(id);
function message(s){$('status').textContent=s;}
async function call(action,body={},authorized=false){if(!API_URL)throw Error('Chưa kích hoạt API. Không thể duyệt tài khoản trên bản xem trước.');const headers={'content-type':'application/json'};if(authorized)headers.authorization='Bearer '+accessToken;const response=await fetch(API_URL,{method:'POST',headers,body:JSON.stringify({action,...body}),cache:'no-store'});const data=await response.json();if(!response.ok)throw Error(data.error||'Lỗi máy chủ');return data;}
$('adminLogin').addEventListener('submit',async e=>{e.preventDefault();message('Đang xác thực...');try{const data=await call('admin_login',{email:$('email').value.trim(),password:$('password').value});if(!data.session?.access_token)throw Error('Không nhận được phiên Admin');accessToken=data.session.access_token;$('password').value='';$('adminLogin').hidden=true;$('dashboard').hidden=false;await refresh();}catch(err){message(err.message);}});
function clear(){accessToken='';$('dashboard').hidden=true;$('adminLogin').hidden=false;$('accounts').replaceChildren();message('Đã đăng xuất.');}
$('logout').addEventListener('click',clear);
async function refresh(){message('Đang tải danh sách...');try{const data=await call('list_accounts',{},true);const root=$('accounts');root.replaceChildren();for(const account of data.accounts||[]){const card=document.createElement('article');const title=document.createElement('strong');title.textContent=account.phone_e164+' — '+account.status;card.append(title);const details=document.createElement('p');const date=new Date(account.created_at);details.textContent='Đăng ký: '+(Number.isNaN(date.getTime())?'Không rõ':date.toLocaleString('vi-VN'));card.append(details);const term=document.createElement('select');for(const [value,label] of [['1m','1 tháng'],['3m','3 tháng'],['12m','12 tháng'],['permanent','Vĩnh viễn']]){const o=document.createElement('option');o.value=value;o.textContent=label;term.append(o);}card.append(term);for(const [action,label] of [['approve','DUYỆT / GIA HẠN'],['deny','TỪ CHỐI'],['revoke','THU HỒI']]){const button=document.createElement('button');button.type='button';button.textContent=label;if(action!=='approve')button.className='secondary';button.addEventListener('click',async()=>{if(!confirm(label+' tài khoản '+account.phone_e164+'?'))return;button.disabled=true;try{await call(action,{user_id:account.user_id,term:term.value},true);await refresh();message('Đã xử lý '+account.phone_e164);}catch(err){message(err.message);}finally{button.disabled=false;}});card.append(button);}root.append(card);}if(!data.accounts?.length)root.textContent='Chưa có tài khoản SĐT.';message('Đã tải '+(data.accounts?.length||0)+' tài khoản.');}catch(err){message(err.message);}}
$('refresh').addEventListener('click',refresh);
</script></body></html>
