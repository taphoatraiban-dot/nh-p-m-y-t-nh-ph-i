<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuncun — Admin thử nghiệm</title><style>
*{box-sizing:border-box}body{font:15px -apple-system,BlinkMacSystemFont,sans-serif;background:#f4f5f7;color:#161616;margin:0;padding:16px}.wrap{max-width:800px;margin:auto}h1{font-size:24px}section{background:white;border:1px solid #ddd;border-radius:14px;padding:18px;margin:16px 0}input,select,button{font:inherit;border-radius:9px;padding:11px}input,select{border:1px solid #bbb;width:100%;margin:7px 0}button{border:0;background:#171717;color:white;cursor:pointer;margin:4px}button:disabled{opacity:.5;cursor:not-allowed}.muted{color:#666;font-size:13px}.item{padding:12px 0;border-top:1px solid #ddd;overflow-wrap:anywhere}.actions{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.actions select{width:auto;max-width:140px}.danger{background:#a92323}.notice{color:#b32222;min-height:22px}.phone{font-weight:700}small{display:block;color:#555;margin-top:5px}</style></head><body><main class="wrap">
<h1>QUẢN TRỊ TÀI KHOẢN SĐT</h1><p class="muted">Bản thử nghiệm Local — không kết nối website chính thức.</p>
<section><label for="token">Access Token của tài khoản Admin thử nghiệm</label><input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Dán token Admin Local (không phải service_role)"><p class="muted">Token chỉ giữ trong bộ nhớ trang; không lưu vào trình duyệt. Không dùng token Production.</p><button id="pending">Tài khoản chờ duyệt</button><button id="all">Tất cả tài khoản</button><button id="clear">Xóa token khỏi trang</button><div class="notice" id="notice" role="status" aria-live="polite"></div></section>
<section><h2>Danh sách</h2><div id="list" class="muted">Bấm xem danh sách sau khi nhập token Admin.</div></section></main>
<script>
'use strict';
const endpoint='http://127.0.0.1:54321/functions/v1/phone-password-auth';
const token=document.getElementById('token'),notice=document.getElementById('notice'),list=document.getElementById('list');
let view='list_pending',busy=false;
const errors={ADMIN_REQUIRED:'Token không hợp lệ hoặc tài khoản không có quyền Admin.',QUERY_FAILED:'Không tải được danh sách.',LICENSE_WRITE_FAILED:'Không cập nhật được bản quyền.',STATUS_UPDATE_FAILED:'Không cập nhật được trạng thái.',AUDIT_WRITE_FAILED:'Không ghi được nhật ký thao tác.'};
function message(m){notice.textContent=errors[m]||m}
async function call(payload){if(!token.value.trim())throw Error('Cần nhập Access Token Admin Local.');const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token.value.trim()},body:JSON.stringify(payload)});const data=await res.json();if(!res.ok)throw Error(data.error||'HTTP '+res.status);return data}
function elt(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
async function refresh(action=view){if(busy)return;busy=true;view=action;message('Đang tải...');try{const data=await call({action});list.replaceChildren();if(!data.accounts?.length){list.textContent='Không có tài khoản trong danh sách.'}for(const a of data.accounts||[]){const item=elt('div',undefined,'item');item.append(elt('div',a.phone_e164,'phone'),elt('small','Trạng thái: '+a.status+' · Ngày tạo: '+new Date(a.created_at).toLocaleString('vi-VN')));const controls=elt('div',undefined,'actions');const term=elt('select');[['1m','1 tháng'],['3m','3 tháng'],['12m','12 tháng'],['permanent','Vĩnh viễn']].forEach(([v,label])=>{const opt=elt('option',label);opt.value=v;term.append(opt)});controls.append(term);for(const [action,label,cls] of [['approve','Duyệt / gia hạn',''],['deny','Từ chối','danger'],['revoke','Thu hồi','danger']]){const btn=elt('button',label,cls);btn.addEventListener('click',async()=>{if(busy)return;const confirmText=action==='approve'?'Duyệt hoặc gia hạn '+a.phone_e164+' theo '+term.options[term.selectedIndex].text+'?':'Xác nhận '+label.toLowerCase()+' tài khoản '+a.phone_e164+'?';if(!confirm(confirmText))return;busy=true;btn.disabled=true;message('Đang cập nhật...');try{await call({action,user_id:a.user_id,term:term.value});message('Đã cập nhật tài khoản '+a.phone_e164+'.');}catch(e){message(e.message)}finally{busy=false;btn.disabled=false}await refresh()});controls.append(btn)}item.append(controls);list.append(item)}message('Đã tải '+(data.accounts||[]).length+' tài khoản.')}catch(e){message(e.message)}finally{busy=false}}
document.getElementById('pending').addEventListener('click',()=>refresh('list_pending'));document.getElementById('all').addEventListener('click',()=>refresh('list_accounts'));document.getElementById('clear').addEventListener('click',()=>{token.value='';list.textContent='Đã xóa token khỏi trang.';message('')});
</script></body></html>
