<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuncun — SĐT + mật khẩu</title><style>body{font:16px system-ui;background:#f5f5f5;margin:0;padding:24px;color:#171717}main{max-width:420px;margin:5vh auto;background:white;border:1px solid #ddd;border-radius:18px;padding:24px}label{display:block;margin:16px 0 6px}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:10px;font:inherit}input{border:1px solid #aaa}button{border:0;background:#171717;color:white;margin-top:12px}button.secondary{background:#eee;color:#171717}p{line-height:1.5}#status{min-height:2em;white-space:pre-wrap}</style></head><body><main><h1>CUNCUN</h1><p>Đăng ký bằng số điện thoại và mật khẩu. Không cần SMS. Tài khoản mới phải chờ Admin duyệt.</p><form id="auth"><label for="phone">Số điện thoại</label><input id="phone" type="tel" autocomplete="tel" required placeholder="09xxxxxxxx"><label for="password">Mật khẩu (ít nhất 12 ký tự)</label><input id="password" type="password" autocomplete="current-password" minlength="12" required><button id="register" type="submit">ĐĂNG KÝ</button><button class="secondary" id="login" type="button">ĐĂNG NHẬP SĐT</button></form><p id="status" role="status" aria-live="polite"></p><p><a href="/">Đăng nhập Gmail trên phần mềm hiện tại</a></p></main><script>
// Isolated preview only. Do not publish until Edge Function, RLS and session integration pass release gates.
const api=''; // Set only after staging endpoint, RLS and account flow are verified.
const status=document.getElementById('status');
async function submit(action){if(!api){status.textContent='Chức năng SĐT đang chuẩn bị phát hành. Vui lòng dùng đăng nhập Gmail hiện tại.';return;}const phone=document.getElementById('phone').value.trim(),password=document.getElementById('password').value;status.textContent='Đang xử lý...';try{const response=await fetch(api,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,phone,password})});const data=await response.json();if(!response.ok){status.textContent=({LICENSE_NOT_APPROVED:'Tài khoản đang chờ Admin duyệt.',LICENSE_INACTIVE:'Bản quyền không hoạt động.',INVALID_CREDENTIALS:'Sai SĐT hoặc mật khẩu.',RATE_LIMITED:'Thử quá nhiều lần. Vui lòng đợi.'})[data.error]||'Không thể xử lý yêu cầu: '+(data.error||response.status);return;}if(action==='register'){status.textContent='Đã gửi yêu cầu. Chờ Admin duyệt trước khi đăng nhập.';return;}status.textContent='Thông tin hợp lệ. Chưa kích hoạt phiên trên phần mềm chính.';}catch{status.textContent='Không kết nối được máy chủ. Chức năng chưa được phát hành.';}}
document.getElementById('auth').addEventListener('submit',e=>{e.preventDefault();submit('register')});document.getElementById('login').addEventListener('click',()=>submit('login'));
</script></body></html>
