<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuncun — SĐT + mật khẩu</title><style>body{font:16px system-ui;background:#f5f5f5;margin:0;padding:24px;color:#171717}main{max-width:420px;margin:5vh auto;background:white;border:1px solid #ddd;border-radius:18px;padding:24px}label{display:block;margin:16px 0 6px}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:10px;font:inherit}input{border:1px solid #aaa}button{border:0;background:#171717;color:white;margin-top:12px}button.secondary{background:#eee;color:#171717}p{line-height:1.5}#status{min-height:2em;white-space:pre-wrap}</style></head><body><main><h1>CUNCUN</h1><p>Đăng ký bằng số điện thoại và mật khẩu. Không cần SMS. Tài khoản mới phải chờ Admin duyệt.</p><form id="auth"><label for="phone">Số điện thoại</label><input id="phone" type="tel" autocomplete="tel" required placeholder="09xxxxxxxx"><label for="password">Mật khẩu (ít nhất 12 ký tự)</label><input id="password" type="password" autocomplete="current-password" minlength="12" required><button id="register" type="submit">ĐĂNG KÝ</button><button class="secondary" id="login" type="button">ĐĂNG NHẬP SĐT</button></form><p id="status" role="status" aria-live="polite"></p><p><a href="/">Đăng nhập Gmail trên phần mềm hiện tại</a></p></main><script>
// Release-branch test page only. Do not merge to production until account flow and RLS tests pass.
const api='https://zigpqddlhvjbjrwhfhaa.supabase.co/functions/v1/phone-password-auth'; // Release-branch test page only; not linked from production main.
const status=document.getElementById('status');
let busy=false;
const registerButton=document.getElementById('register'),loginButton=document.getElementById('login');
async function submit(action){if(busy)return;busy=true;registerButton.disabled=true;loginButton.disabled=true;try{await perform(action);}finally{busy=false;registerButton.disabled=false;loginButton.disabled=false;}}
async function perform(action){if(!api){status.textContent='Chức năng SĐT đang chuẩn bị phát hành. Vui lòng dùng đăng nhập Gmail hiện tại.';return;}const phone=document.getElementById('phone').value.trim(),password=document.getElementById('password').value;if(!/^(?:0[35789][0-9]{8}|\+84[35789][0-9]{8})$/.test(phone.replace(/[\s().-]/g,''))){document.getElementById('password').value='';status.textContent='Số điện thoại Việt Nam không hợp lệ.';return;}if(password.length<12||password.length>128){document.getElementById('password').value='';status.textContent='Mật khẩu phải có từ 12 đến 128 ký tự.';return;}status.textContent='Đang xử lý...';try{const response=await fetch(api,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,phone,password}),cache:'no-store'});const data=await response.json();if(!response.ok){document.getElementById('password').value='';status.textContent=({LICENSE_NOT_APPROVED:'Tài khoản chưa được Admin duyệt hoặc đã bị từ chối/thu hồi.',LICENSE_INACTIVE:'Bản quyền không hoạt động.',INVALID_CREDENTIALS:'Sai SĐT hoặc mật khẩu.',REGISTRATION_FAILED:'Không thể đăng ký. SĐT có thể đã được sử dụng.',INVALID_PHONE:'SĐT không hợp lệ.',INVALID_PASSWORD:'Mật khẩu không hợp lệ.',RATE_LIMITED:'Thử quá nhiều lần. Vui lòng đợi.'})[data.error]||'Không thể xử lý yêu cầu: '+(data.error||response.status);return;}if(action==='register'){document.getElementById('password').value='';status.textContent='Đã gửi yêu cầu. Chờ Admin duyệt trước khi đăng nhập.';return;}if(!data.session?.access_token||!data.session?.refresh_token){document.getElementById('password').value='';status.textContent='Máy chủ không trả về phiên đăng nhập hợp lệ.';return;}document.getElementById('password').value='';try{sessionStorage.setItem('cuncun_phone_pending_session',JSON.stringify({access_token:data.session.access_token,refresh_token:data.session.refresh_token,created_at:Date.now()}));status.textContent='Đăng nhập hợp lệ. Đang chuyển về phần mềm...';location.assign('/?phone_session=1');}catch{document.getElementById('password').value='';status.textContent='Không thể chuyển phiên đăng nhập. Hãy bật lưu trữ trình duyệt.';}}catch{document.getElementById('password').value='';status.textContent='Không kết nối được máy chủ. Hãy thử lại sau.';}}
document.getElementById('auth').addEventListener('submit',e=>{e.preventDefault();submit('register')});document.getElementById('login').addEventListener('click',()=>submit('login'));
</script></body></html>
