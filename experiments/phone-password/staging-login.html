<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuncun - Đăng nhập thử nghiệm</title>
<style>body{font:16px system-ui;background:#f5f5f5;color:#171717;margin:0;padding:20px}main{max-width:420px;margin:35px auto;background:white;border-radius:14px;padding:24px;box-shadow:0 3px 18px #0001}h1{font-size:23px}label{display:block;margin:16px 0 5px}input,button{box-sizing:border-box;width:100%;padding:13px;font-size:17px;border:1px solid #bbb;border-radius:9px}button{margin-top:15px;background:#171717;color:#fff;border:0;cursor:pointer}button:disabled{opacity:.5}nav{display:flex;gap:10px}nav button{background:#e7e7e7;color:#111}nav button[aria-selected=true]{background:#222;color:white}#message{min-height:22px}small{color:#666}</style></head>
<body><main><h1>CUNCUN · Thử nghiệm đăng nhập</h1><nav><button id="phoneTab" type="button" aria-selected="true">Số điện thoại</button><button id="emailTab" type="button" aria-selected="false">Gmail / Email</button></nav>
<form id="form"><label for="identity" id="identityLabel">Số điện thoại</label><input id="identity" autocomplete="username" required placeholder="09xxxxxxxx" inputmode="tel">
<label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required minlength="12">
<button id="login" type="submit">Đăng nhập</button><button id="register" type="button">Đăng ký SĐT</button></form>
<p id="message" role="status" aria-live="polite"></p><small>Trang thử nghiệm độc lập. Tài khoản mới cần quản trị viên duyệt. Không gửi SMS. Không xác minh quyền sở hữu SĐT.</small></main>
<script type="module">
const $=id=>document.getElementById(id);let mode='phone';const form=$('form'),message=$('message');
function switchMode(next){mode=next;$('phoneTab').setAttribute('aria-selected',String(next==='phone'));$('emailTab').setAttribute('aria-selected',String(next==='email'));$('identityLabel').textContent=next==='phone'?'Số điện thoại':'Gmail / Email';$('identity').placeholder=next==='phone'?'09xxxxxxxx':'email@example.com';$('identity').type=next==='phone'?'tel':'email';$('identity').inputMode=next==='phone'?'tel':'email';$('register').hidden=next!=='phone';$('password').minLength=next==='phone'?12:1;message.textContent='';}
$('phoneTab').onclick=()=>switchMode('phone');$('emailTab').onclick=()=>switchMode('email');
async function submit(action){
 message.textContent='Đang xử lý…';const buttons=[$('login'),$('register')];buttons.forEach(b=>b.disabled=true);
 try{
  // All auth happens on a server. Do not put alias secrets or service-role keys in this HTML.
  const response=await fetch('/api/staging-auth/'+(mode==='phone'?'phone':'email')+'/'+action,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({identity:$('identity').value.trim(),password:$('password').value})});
  const body=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(response.status===404?'Máy chủ thử nghiệm chưa được kết nối.':body.message||'Không thể xử lý yêu cầu.');
  message.textContent=body.message||'Yêu cầu đã được xử lý.';
 }catch(e){message.textContent=e.message||'Lỗi kết nối.'}finally{buttons.forEach(b=>b.disabled=false);}
}
form.addEventListener('submit',e=>{e.preventDefault();submit('login')});$('register').onclick=()=>submit('register');
</script></body></html>
