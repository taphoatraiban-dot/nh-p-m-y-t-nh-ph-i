<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CUNCUN · Zalo Chat (demo)</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17253c;background:#edf3f9}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:1000px;margin:0 auto;min-height:100dvh;background:#fff;display:flex;flex-direction:column}.header{background:#087cf5;color:white;padding:calc(12px + env(safe-area-inset-top)) 15px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.header strong{font-size:18px}.header small{display:block;font-size:12px;opacity:.9}.pill{border:1px solid #d3e0ee;border-radius:999px;padding:7px 11px;background:#f4f8fc;color:#24557c;font-size:12px}.header .pill{background:#fff;color:#0758a5}.banner{padding:9px 14px;background:#fff5da;color:#705300;font-size:12px}.tabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid #e3e9f0}.tabs button{flex:1;border:0;background:#edf3fa;padding:10px;border-radius:10px}.tabs button[aria-pressed=true]{background:#087cf5;color:#fff}.search{padding:8px 12px}.search input{width:100%;border:1px solid #d8e2ee;border-radius:10px;padding:11px}.body{display:grid;grid-template-columns:36% 64%;flex:1;min-height:450px}.conversations{border-right:1px solid #e2e9f1}.item{width:100%;border:0;border-bottom:1px solid #eef1f5;background:white;padding:13px;display:flex;text-align:left;gap:10px;align-items:center}.item.active{background:#e9f4ff}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#d9ecff;color:#1266b5;font-weight:700;flex:none}.item .name{font-weight:650}.item small{display:block;color:#66798d;margin-top:4px}.count{background:#087cf5;color:white;border-radius:999px;padding:2px 7px;font-size:11px;margin-left:auto}.thread{display:flex;flex-direction:column;min-width:0}.thread-title{padding:13px;border-bottom:1px solid #e2e9f1;display:flex;justify-content:space-between;align-items:center}.messages{flex:1;padding:16px;background:#f5f8fc;display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:250px}.bubble{background:white;border-radius:14px;padding:10px 12px;max-width:85%;box-shadow:0 1px 2px #0001;align-self:flex-start;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#d9edff}.bubble small{display:block;color:#718397;margin-top:5px}.tools{padding:10px;display:flex;flex-wrap:wrap;gap:7px;border-top:1px solid #e3eaf2}.tools button,.back{border:1px solid #cbdbea;background:#fff;border-radius:9px;padding:9px;color:#175c9d}.tools .primary{background:#087cf5;color:white;border-color:#087cf5}.compose{display:flex;gap:8px;padding:12px;border-top:1px solid #e3eaf2}.compose input{flex:1;min-width:0;border:1px solid #d6e0ea;border-radius:9px;padding:11px}.compose button{background:#087cf5;border:0;border-radius:9px;color:#fff;padding:10px 16px}.notice{padding:10px 14px;font-size:12px;color:#65768a}.back{display:none}.empty{margin:auto;color:#718397;text-align:center;padding:20px}.selectbox{margin-right:7px}.hidden{display:none!important}
@media(max-width:650px){.app{height:100dvh;min-height:0;overflow:hidden}.header{flex-shrink:0}.banner{flex-shrink:0}.body{display:block;position:relative;min-height:0;overflow:auto}.conversations{border:0}.thread{display:none;height:100%;min-height:0;overflow:hidden}.app.thread-open .conversations,.app.thread-open .search,.app.thread-open .tabs{display:none}.app.thread-open .body{overflow:hidden}.app.thread-open .thread{display:flex}.back{display:inline-block}.thread-title{gap:8px;flex-shrink:0}.tools{flex-shrink:0}.tools button{font-size:12px;padding:8px}.messages{min-height:0;overflow-y:auto;overscroll-behavior:contain}.compose,.notice{flex-shrink:0}}
</style></head><body>
<main class="app" id="app"><header class="header"><div><strong>💬 Zalo Chat</strong><small>CUNCUN · Giao diện thử nghiệm</small></div><span class="pill">Chưa kết nối</span></header><div class="banner">Dữ liệu minh họa — không đọc, gửi hoặc đồng bộ với Zalo thật.</div>
<div class="tabs" role="group" aria-label="Lọc hội thoại"><button data-filter="private" aria-pressed="true">Cá nhân</button><button data-filter="group" aria-pressed="false">Nhóm</button><button data-filter="all" aria-pressed="false">Tất cả</button></div>
<div class="search"><input id="search" type="search" placeholder="Tìm người hoặc nhóm…" aria-label="Tìm hội thoại"></div>
<div class="body"><nav class="conversations" id="conversations" aria-label="Danh sách hội thoại mẫu"></nav><section class="thread" aria-label="Nội dung hội thoại mẫu"><div class="thread-title"><button class="back" id="back">←</button><strong id="heading">Chọn hội thoại</strong><span class="pill">Mẫu</span></div><div class="messages" id="messages"><div class="empty">Chọn hội thoại để xem dữ liệu mẫu</div></div><div class="tools"><button id="select">Chọn tin</button><button id="all">Chọn tất cả</button><button id="copy">Sao chép (0)</button><button id="delete">Xóa khỏi demo</button><button class="primary" id="import" disabled title="Chưa hỗ trợ trong demo cách ly">Đưa vào ô nhập (chưa hỗ trợ)</button></div><div class="compose"><input aria-label="Soạn tin" placeholder="Chưa hỗ trợ gửi Zalo thật" disabled><button disabled>Gửi</button></div></section></div><footer class="notice" id="status" role="status">Chế độ an toàn: không có kết nối mạng hoặc lưu trữ dữ liệu.</footer></main>
<script>
'use strict';
// All content below is fabricated UI fixture data; never a real inbox.
const demo=[{id:1,name:'Khách hàng A',kind:'private',unread:2,messages:[{id:1,text:'Chào, cho mình hỏi thông tin nhé',time:'10:20',mine:false},{id:2,text:'Mình đã nhận tin',time:'10:21',mine:true}]},{id:2,name:'Khách hàng B',kind:'private',unread:0,messages:[{id:3,text:'Mình gửi nội dung sau nhé',time:'09:40',mine:false}]},{id:3,name:'Nhóm khách hàng',kind:'group',unread:1,messages:[{id:4,text:'Chào cả nhóm',time:'08:30',mine:false}]}];
let filter='private',current=null,selecting=false,selected=new Set();
const $=id=>document.getElementById(id),app=$('app');
function status(s){$('status').textContent=s}
function renderList(){const query=$('search').value.trim().toLocaleLowerCase('vi');const list=$('conversations');list.replaceChildren();for(const chat of demo.filter(c=>(filter==='all'||c.kind===filter)&&c.name.toLocaleLowerCase('vi').includes(query))){const b=document.createElement('button');b.className='item'+(current===chat.id?' active':'');const avatar=document.createElement('span');avatar.className='avatar';avatar.textContent=chat.kind==='group'?'👥':chat.name.slice(-1);const body=document.createElement('span');const title=document.createElement('span');title.className='name';title.textContent=chat.name;const sub=document.createElement('small');sub.textContent=chat.messages.at(-1)?.text||'Không có tin';body.append(title,sub);b.append(avatar,body);if(chat.unread){const count=document.createElement('span');count.className='count';count.textContent=chat.unread;b.append(count)}b.onclick=()=>{chat.unread=0;current=chat.id;selected.clear();selecting=false;$('select').textContent='Chọn tin';app.classList.add('thread-open');renderList();renderThread()};list.append(b)}if(!list.children.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='Không tìm thấy hội thoại mẫu';list.append(empty)}}
function clearManualCopy(){const field=$('manualCopy');if(field)field.remove()}
function renderThread(){clearManualCopy();const chat=demo.find(c=>c.id===current);$('heading').textContent=chat?.name||'Chọn hội thoại';const container=$('messages');container.replaceChildren();if(!chat){updateCount();const p=document.createElement('div');p.className='empty';p.textContent='Chọn hội thoại để xem dữ liệu mẫu';container.append(p);return}if(!chat.messages.length){const p=document.createElement('div');p.className='empty';p.textContent='Chưa có tin nhắn trong hội thoại mẫu';container.append(p)}for(const msg of chat.messages){const wrap=document.createElement('div');wrap.className='bubble'+(msg.mine?' mine':'');if(selecting){const cb=document.createElement('input');cb.type='checkbox';cb.className='selectbox';cb.checked=selected.has(msg.id);cb.setAttribute('aria-label','Chọn tin nhắn');cb.onchange=()=>{cb.checked?selected.add(msg.id):selected.delete(msg.id);updateCount()};wrap.append(cb)}const t=document.createElement('span');t.textContent=msg.text;const time=document.createElement('small');time.textContent=msg.time;wrap.append(t,time);container.append(wrap)}updateCount()}
function updateCount(){const chat=demo.find(c=>c.id===current);const hasMessages=!!chat?.messages.length;$('select').disabled=!hasMessages;$('all').disabled=!hasMessages;$('copy').textContent='Sao chép ('+selected.size+')';$('copy').disabled=!selected.size;$('delete').disabled=!selected.size;$('import').disabled=true}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;current=null;selected.clear();selecting=false;$('select').textContent='Chọn tin';app.classList.remove('thread-open');document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderList();renderThread()});
$('search').oninput=()=>{if(current!==null){current=null;selected.clear();selecting=false;$('select').textContent='Chọn tin';app.classList.remove('thread-open');renderThread()}renderList()};$('back').onclick=()=>{clearManualCopy();app.classList.remove('thread-open');$('search').focus()};
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&app.classList.contains('thread-open')){clearManualCopy();app.classList.remove('thread-open');$('search').focus()}});
$('select').onclick=()=>{selecting=!selecting;selected.clear();$('select').textContent=selecting?'Bỏ chọn':'Chọn tin';renderThread()};
$('all').onclick=()=>{const c=demo.find(c=>c.id===current);if(!c)return;selecting=true;const ids=c.messages.map(m=>m.id);selected=ids.length&&ids.every(id=>selected.has(id))?new Set():new Set(ids);$('select').textContent='Bỏ chọn';renderThread()};
function selectedText(){const c=demo.find(c=>c.id===current);return c?c.messages.filter(m=>selected.has(m.id)).map(m=>m.text).join('\n'):''}
$('copy').onclick=async()=>{
 const text=selectedText();if(!text)return;
 clearManualCopy();
 try{
  if(!navigator.clipboard?.writeText)throw new Error('Clipboard API unavailable');
  await navigator.clipboard.writeText(text);status('Đã sao chép tin nhắn mẫu');
 }catch{
  // Clipboard API is often blocked inside sandboxed frames on iPhone.
  const field=document.createElement('textarea');field.value=text;
  field.setAttribute('readonly','');field.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
  document.body.append(field);field.focus();field.select();
  let copied=false;try{copied=document.execCommand('copy')}catch{}
  field.remove();
  if(copied){status('Đã sao chép tin nhắn mẫu')}else{
   // Offer an accessible manual fallback when iOS blocks clipboard APIs in sandbox.
   let manual=$('manualCopy');
   if(!manual){manual=document.createElement('textarea');manual.id='manualCopy';manual.readOnly=true;manual.setAttribute('aria-label','Nội dung tin nhắn mẫu để sao chép thủ công');manual.style.cssText='display:block;box-sizing:border-box;width:calc(100% - 24px);min-height:90px;margin:8px 12px;padding:10px;border:1px solid #a8bcd0;border-radius:8px';$('status').before(manual)}
   manual.value=text;manual.focus();manual.select();
   status('Sao chép tự động bị chặn. Hãy chạm giữ nội dung trong ô để chọn Sao chép.');
  }
 }
};
$('delete').onclick=()=>{if(!confirm('Xóa các tin mẫu đã chọn khỏi giao diện demo?'))return;const c=demo.find(c=>c.id===current);if(!c)return;c.messages=c.messages.filter(m=>!selected.has(m.id));selected.clear();selecting=false;$('select').textContent='Chọn tin';renderThread();renderList();status('Đã xóa bản sao demo; không ảnh hưởng Zalo')};
// Import into the production bets field is intentionally unavailable in this sandboxed demo.
renderList();updateCount();
</script></body></html>
