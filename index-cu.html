<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Máy tính phơi - Khóa thiết bị</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#17202a}
.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #0000000b}
h1{font-size:22px;text-align:center;margin:5px 0 14px}.muted{color:#687078;font-size:12px}
input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid #bbb;border-radius:10px;background:#fff}
textarea{min-height:260px;font:14px/1.45 ui-monospace,monospace}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid label{font-size:12px;font-weight:800}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#c51d2b;color:#fff}.blue{background:#2563eb;color:#fff}.green{background:#087f5b;color:#fff}.danger{background:#a61b29;color:#fff}.soft{background:#e9ecef}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.buttons button{flex:1;min-width:140px}
.status{padding:10px;border-radius:10px;background:#eef4ff;margin-top:10px;font-size:13px}.ok{background:#eafaf3;color:#08643c}.err{background:#fff0f0;color:#a00}
.hidden{display:none}.device{background:#f7f8fa;border-radius:10px;padding:10px;margin-top:10px}.badge{display:inline-block;padding:3px 8px;border-radius:99px;background:#e8eefc;font-size:11px;font-weight:800}
.title{font-weight:900;background:#eef3ff;padding:10px;border-radius:9px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{text-align:center;border:1px solid #eee;border-radius:10px;padding:9px}.stat b{display:block;font-size:18px}
.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border-bottom:1px solid #eee;padding:7px;white-space:nowrap;text-align:right}th:first-child,td:first-child{text-align:left}
@media(max-width:600px){.grid{grid-template-columns:1fr}.buttons{display:grid;grid-template-columns:1fr 1fr}.buttons button{min-width:0}.stats{grid-template-columns:1fr 1fr}}

.customer-list{display:grid;gap:8px}.customer-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid #eee;border-radius:10px;padding:9px}.customer-row small{display:block;color:#687078}.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.price-grid label{font-size:12px;font-weight:800}.price-grid input{margin-top:4px}@media(max-width:600px){.price-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

<section id="loginCard" class="card">
<h1>🔐 ĐĂNG NHẬP</h1>
<div class="grid">
<label>Email / tài khoản
<input id="email" type="email" autocomplete="username" placeholder="email">
</label>
<label>Mật khẩu
<input id="password" type="password" autocomplete="current-password" placeholder="mật khẩu">
</label>
</div>
<div class="buttons">
<button class="primary" id="loginBtn">ĐĂNG NHẬP</button>
</div>
<div id="loginStatus" class="status">Nhập tài khoản và mật khẩu.</div>
<p class="muted">Mỗi tài khoản được ràng buộc với một thiết bị trình duyệt. Việc khóa được kiểm tra ở máy chủ.</p>
</section>

<section id="appCard" class="hidden">
<div class="card">
<h1>🧮 MÁY TÍNH PHƠI</h1>
<div class="device">
<div><span class="badge">THIẾT BỊ</span> <b id="deviceState">Đang kiểm tra...</b></div>
<div class="muted" id="deviceInfo"></div>
</div>
<div class="buttons">
<button class="soft" id="logoutBtn">ĐĂNG XUẤT</button>
</div>
</div>

<div class="card">
<div class="title">👤 GIÁ KHÁCH HÀNG</div>
<div class="grid">
<label>Khách đang tính
<select id="customerSelect"></select>
</label>
<label>Tên khách mới
<input id="customerName" placeholder="Ví dụ: Khách A">
</label>
</div>
<div class="price-grid" style="margin-top:9px">
<label>XC<input id="p_xc" type="number" step="0.01"></label>
<label>DD<input id="p_dd" type="number" step="0.01"></label>
<label>DA 2 đài<input id="p_da2" type="number" step="0.01"></label>
<label>DA thẳng<input id="p_dathang" type="number" step="0.01"></label>
<label>B 2 số<input id="p_b2" type="number" step="0.01"></label>
<label>B 3 số<input id="p_b3" type="number" step="0.01"></label>
<label>B 4 số<input id="p_b4" type="number" step="0.01"></label>
<label>Giá nhận<input id="p_receive" type="number" step="0.01" value="0.80"></label>
<label>Hồi khi thu<input id="p_repay" type="number" step="0.01" value="1"></label>
</div>
<div class="buttons">
<button class="green" id="saveCustomer">💾 LƯU KHÁCH</button>
<button class="soft" id="newCustomer">＋ KHÁCH MỚI</button>
<button class="danger" id="deleteCustomer">🗑 XÓA KHÁCH</button>
</div>
<div id="customerStatus" class="status">Bảng giá lưu trên trình duyệt này.</div>
</div>

<div class="card">
<div class="grid">
<label>Ngày<input id="date" type="date"></label>
<label>Gốc đang dùng
<input id="rateDisplay" value="Khách đang chọn" readonly>
</label>
</div>
<textarea id="bets" placeholder="Dán phơi vào đây..."></textarea>
<div class="buttons">
<button class="primary" id="calc">TÍNH PHƠI</button>
<button class="blue" id="get">LẤY KQ 3 MIỀN</button>
<button class="green" id="scan">TỰ DÒ</button>
<button class="soft" id="clear">XÓA</button>
</div>
<div id="status" class="status">Sẵn sàng.</div>
</div>
<section id="out"></section>
</section>

</div>

<script>
const SUPABASE_URL="https://zigpqddlhvjbjrwhfhaa.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_U8VKihgNe0M7ff5KHB3Mvg_04ifZ7ni";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const $=id=>document.getElementById(id);
const setStatus=(t,cls="")=>{ $("status").className="status "+cls; $("status").textContent=t; };
const loginStatus=(t,cls="")=>{ $("loginStatus").className="status "+cls; $("loginStatus").textContent=t; };

function deviceId(){
  let id=localStorage.getItem("device_lock_id");
  if(!id){
    id=crypto.randomUUID();
    localStorage.setItem("device_lock_id",id);
  }
  return id;
}
function deviceName(){
  const ua=navigator.userAgent;
  if(/iPhone/i.test(ua))return "iPhone";
  if(/iPad/i.test(ua))return "iPad";
  if(/Android/i.test(ua))return "Android";
  if(/Mac/i.test(ua))return "Mac";
  if(/Windows/i.test(ua))return "Windows";
  return "Thiết bị web";
}
async function claimDevice(){
  const {data,error}=await sb.rpc("claim_device",{p_device_id:deviceId(),p_device_name:deviceName()});
  if(error)throw error;
  if(!data?.allowed) throw new Error(data?.message||"Tài khoản đã khóa trên thiết bị khác.");
  $("deviceState").textContent="ĐÃ KHÓA CHO THIẾT BỊ NÀY";
  $("deviceInfo").textContent=`${deviceName()} • mã thiết bị ${deviceId().slice(0,8)}…`;
}
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){
    try{await claimDevice();showApp();}
    catch(e){await sb.auth.signOut();showLogin();loginStatus(e.message,"err");}
  }else showLogin();
}
function showApp(){$("loginCard").classList.add("hidden");$("appCard").classList.remove("hidden");}
function showLogin(){$("loginCard").classList.remove("hidden");$("appCard").classList.add("hidden");}
$("loginBtn").onclick=async()=>{
  loginStatus("Đang đăng nhập...");
  const {data,error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
  if(error){loginStatus(error.message,"err");return;}
  try{await claimDevice();showApp();loginStatus("");}
  catch(e){await sb.auth.signOut();showLogin();loginStatus(e.message,"err");}
};
$("logoutBtn").onclick=async()=>{await sb.auth.signOut();showLogin();};
sb.auth.onAuthStateChange((_event,session)=>{if(!session)showLogin();});

const DEFAULT_CUSTOMERS={
  "X74":{xc:640,dd:74,da2:540,dathang:700,b2:74,b3:640,b4:5200,receive:.80,repay:1},
  "X79":{xc:640,dd:76,da2:540,dathang:700,b2:75,b3:640,b4:5000,receive:.79,repay:1},
  "Hạnh":{xc:650,dd:75,da2:550,dathang:730,b2:75,b3:650,b4:5000,receive:.76,repay:.95},
  "Tuấn":{xc:650,dd:75,da2:550,dathang:730,b2:75,b3:650,b4:5000,receive:.77,repay:.95}
};
const CUSTOMER_KEY="phoi_customers_v1";
let customers=JSON.parse(localStorage.getItem(CUSTOMER_KEY)||"null")||DEFAULT_CUSTOMERS;
let currentCustomer="X74";
function saveCustomers(){localStorage.setItem(CUSTOMER_KEY,JSON.stringify(customers));}
function syncCustomerSelect(){const sel=$("customerSelect");sel.innerHTML=Object.keys(customers).map(n=>`<option>${n.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</option>`).join(""); if(customers[currentCustomer])sel.value=currentCustomer; loadCustomer();}
function loadCustomer(){currentCustomer=$("customerSelect").value;const c=customers[currentCustomer];if(!c)return; ["xc","dd","da2","dathang","b2","b3","b4"].forEach(k=>$("p_"+k).value=c[k]);$("p_receive").value=c.receive;$("p_repay").value=c.repay;$("rateDisplay").value=`${currentCustomer} — nhận ${c.receive} / hồi ${c.repay}`;$("customerStatus").textContent=`Đang dùng bảng giá: ${currentCustomer}`;}
function readCustomer(){return {xc:+$("p_xc").value||0,dd:+$("p_dd").value||0,da2:+$("p_da2").value||0,dathang:+$("p_dathang").value||0,b2:+$("p_b2").value||0,b3:+$("p_b3").value||0,b4:+$("p_b4").value||0,receive:+$("p_receive").value||0,repay:+$("p_repay").value||0};}
$("customerSelect").onchange=loadCustomer;
$("newCustomer").onclick=()=>{$("customerName").value="";$("customerName").focus();};
$("saveCustomer").onclick=()=>{let name=$("customerName").value.trim()||$("customerSelect").value;if(!name){alert("Nhập tên khách.");return;}customers[name]=readCustomer();currentCustomer=name;saveCustomers();syncCustomerSelect();$("customerSelect").value=name;loadCustomer();$("customerStatus").textContent=`Đã lưu bảng giá cho ${name}.`;};
$("deleteCustomer").onclick=()=>{let name=$("customerSelect").value;if(Object.keys(customers).length<=1){alert("Phải giữ ít nhất 1 bảng giá.");return;}if(confirm(`Xóa bảng giá ${name}?`)){delete customers[name];saveCustomers();currentCustomer=Object.keys(customers)[0];syncCustomerSelect();}};

function groups(r){return r==="B"?27:18}
function stationToken(t){
 t=t.toLowerCase().replace(/[.:;]+$/,"");
 if(/^\d+d(mn|mt)$/.test(t))return{region:t.endsWith("mn")?"N":"T",stations:+t[0],label:+t[0]+" Đài "+(t.endsWith("mn")?"MN":"MT")};
 if(["hn","mb"].includes(t))return{region:"B",stations:1,label:"Hà Nội/Bắc"};
 if(t==="dnai")return{region:"N",stations:1,label:"Đồng Nai"};
 if(t==="ctho")return{region:"N",stations:1,label:"Cần Thơ"};
 if(["st","sot"].includes(t))return{region:"N",stations:1,label:"Sóc Trăng"};
 if(["dnang","danang"].includes(t))return{region:"T",stations:1,label:"Đà Nẵng"};
 if(["kh","khanhhoa"].includes(t))return{region:"T",stations:1,label:"Khánh Hòa"};
 return null;
}
function nums(s){return String(s).replace(/[\s,;]+/g,".").replace(/\.{2,}/g,".").replace(/^[.]+|[.]+$/g,"").match(/\d{2,4}/g)||[]}
function addBet(rows,st,raw,type,p){
 const ns=nums(raw);if(!ns.length)return;let g=groups(st.region),gross=0,label=type.toUpperCase();
 if(type==="b"){let d=ns[0].length,pr=st.region==="B"?(d===2?27:d===3?23:20):(d===2?18:d===3?17:16);gross=ns.length*p*pr*st.stations;label="B"+d}
 else if(type==="xc"){gross=ns.length*p*4;label="XC"}
 else if(type==="dd"){gross=ns.length*p*2*st.stations;label="DD"}
 else if(type==="dau"||type==="duoi"){gross=ns.length*p*st.stations;label=type==="dau"?"ĐẦU":"ĐUÔI"}
 else if(type==="da"){gross=ns.length*(ns.length-1)*g*st.stations*p;label="DA"}
 else return;
 rows.push({region:st.region,station:st.label,numbers:ns,type:label,points:p,gross});
}
function parseBets(){
 let rows=[],errors=[],st={region:"N",stations:1,label:"Mặc định"};
 for(let line of $("bets").value.replace(/\r/g,"").split("\n")){
  let s=line.trim();if(!s)continue;
  let tok=s.split(/\s+/)[0],q=stationToken(tok);
  if(q){st=q;s=s.slice(tok.length).trim();if(!s)continue}
  const re=/(daoxc|dxc|xcdao|xcduoi|xduoi|xc|x|da|dv|bdao|daob|b|dd|dau|duoi)(\d+(?:[.,]\d+)?)(?:n)?/gi;
  let m,last=0,found=false;
  while((m=re.exec(s))){
   found=true;let raw=s.slice(last,m.index).replace(/[.\s]+$/,"").trim(),typ=m[1].toLowerCase(),p=parseFloat(m[2].replace(",","."));let actual=typ==="x"?"xc":typ==="dv"?"da":(typ==="xduoi"||typ==="xcduoi")?"duoi":typ;
   if(actual.includes("dao"))errors.push("Chưa hỗ trợ đảo: "+line);else addBet(rows,st,raw,actual,p);
   last=m.index+m[0].length;
  }
  if(!found)errors.push(line);
 }
 return{rows,errors};
}
function money(x){return Math.round(x).toLocaleString("vi-VN")+"k"}
function renderCalc(){
 const {rows,errors}=parseBets(),c=customers[$("customerSelect").value]||readCustomer();let html="",total=0;
 const rate=c.receive;
 for(const [r,n] of [["N","🄽 MIỀN NAM"],["T","🅃 MIỀN TRUNG"],["B","🅱 MIỀN BẮC"]]){
  const a=rows.filter(x=>x.region===r),g=a.reduce((s,x)=>s+x.gross,0),thu=g*rate;total+=thu;
  html+=`<section class="card"><div class="title">${n}</div><div class="stats"><div class="stat"><b>${money(g)}</b><small>Tiền xác</small></div><div class="stat"><b>0k</b><small>Tiền trúng</small></div><div class="stat"><b>${money(thu)}</b><small>Thu trước trúng</small></div></div><div class="scroll"><table><tr><th>Phơi</th><th>Đài</th><th>Loại</th><th>Điểm</th><th>Tiền</th></tr>${a.map(x=>`<tr><td>${x.numbers.join("–")}</td><td>${x.station}</td><td>${x.type}</td><td>${x.points}n</td><td>${x.gross}k</td></tr>`).join("")}</table></div></section>`;
 }
 if(errors.length)html+=`<section class="card err"><b>Dòng chưa đọc:</b><br>${errors.map(x=>x.replace(/</g,"&lt;")).join("<br>")}</section>`;
 html+=`<section class="card"><b>KHÁCH: ${currentCustomer}</b><br><b>TỔNG XÁC: ${money(rows.reduce((s,x)=>s+x.gross,0))}</b><br><span class="muted">Giá nhận ${c.receive} • Hồi ${c.repay}</span></section>`;
 $("out").innerHTML=html;
}



// ===== TRA KẾT QUẢ 3 MIỀN / TỰ DÒ =====
const RESULTS_FUNCTION_URL = SUPABASE_URL + "/functions/v1/xoso-results";
let lotteryResults = {N:[], T:[], B:[]};

async function fetchLotteryRegion(region){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) throw new Error("Phiên đăng nhập đã hết. Vui lòng đăng nhập lại.");
  const d = $("date").value;
  if(!d) throw new Error("Chưa chọn ngày.");
  const url = RESULTS_FUNCTION_URL + "?date=" + encodeURIComponent(d) + "&region=" + region;
  const res = await fetch(url, {
    method:"GET",
    headers:{
      "Authorization":"Bearer "+session.access_token,
      "apikey":SUPABASE_PUBLISHABLE_KEY,
      "Accept":"application/json"
    }
  });
  const json = await res.json().catch(()=>({}));
  if(!res.ok || !json.ok) throw new Error(json.error || ("Lỗi lấy KQ "+region+" (HTTP "+res.status+")"));
  const payload = json.data || {};
  return Array.isArray(payload.data) ? payload.data : [];
}

async function getAllLotteryResults(){
  setStatus("Đang lấy kết quả MN + MT + MB...");
  const [mn,mt,mb] = await Promise.all([
    fetchLotteryRegion("MN"),
    fetchLotteryRegion("MT"),
    fetchLotteryRegion("MB")
  ]);
  lotteryResults = {N:mn, T:mt, B:mb};
  const count = mn.length + mt.length + mb.length;
  setStatus(`Đã lấy KQ 3 miền ngày ${$("date").value}: ${count} đài.`,"ok");
  return lotteryResults;
}

function drawProvince(draw){
  return String(draw?.province?.name || draw?.province?.code || "").trim();
}
function drawPrizes(draw){
  const p=draw?.prizes || {};
  const out={};
  for(const k of Object.keys(p)){
    const v=p[k];
    out[k]=Array.isArray(v)?v.map(String):(v==null?[]:[String(v)]);
  }
  return out;
}
function cleanDigits(v){return String(v||"").replace(/\D/g,"");}
function lastN(v,n){const d=cleanDigits(v);return d.length>=n?d.slice(-n):"";}
function prizeEntries(draw){
  const p=drawPrizes(draw), out=[];
  for(const k of Object.keys(p)){
    for(const v of p[k]){
      const d=cleanDigits(v);
      if(d) out.push({prize:k,value:d});
    }
  }
  return out;
}
function provinceMatches(label, draw){
  const q=String(label||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const n=drawProvince(draw).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  if(!q || q==="mac dinh") return true;
  if(q.includes("dong nai")) return n.includes("dong nai");
  if(q.includes("can tho")) return n.includes("can tho");
  if(q.includes("da nang")) return n.includes("da nang");
  if(q.includes("khanh hoa")) return n.includes("khanh hoa");
  if(q.includes("soc trang")) return n.includes("soc trang");
  return n.includes(q) || q.includes(n);
}
function regionDraws(row){
  return (lotteryResults[row.region]||[]).filter(d=>provinceMatches(row.station,d));
}
function resultForB(row,draw){
  const digits=row.numbers[0]||"", len=digits.length, entries=prizeEntries(draw);
  const excluded = row.region==="B" ? (len===3?["g7"]:len===4?["g6","g7"]:[]) : (len===3?["g8"]:len===4?["g7","g8"]:[]);
  return entries.filter(e=>!excluded.includes(e.prize) && lastN(e.value,len)===digits.padStart(len,"0"));
}
function resultForXC(row,draw){
  const want=(row.numbers[0]||"").padStart(3,"0");
  const keys=row.region==="B"?["g6","db"]:["g7","db"];
  const p=drawPrizes(draw), out=[];
  for(const k of keys) for(const v of (p[k]||[])) if(lastN(v,3)===want) out.push({prize:k,value:v});
  return out;
}
function resultForDD(row,draw){
  const want=(row.numbers[0]||"").padStart(2,"0"), p=drawPrizes(draw), out=[];
  const small=row.region==="B"?"g7":"g8";
  for(const v of (p[small]||[])) if(lastN(v,2)===want) out.push({prize:small,value:v});
  for(const v of (p.db||[])) if(lastN(v,2)===want) out.push({prize:"db",value:v});
  return out;
}
function resultForDA(row,draw){
  const wanted=[...new Set(row.numbers.map(x=>lastN(x,2)))];
  const seen=new Set(prizeEntries(draw).map(e=>lastN(e.value,2)).filter(Boolean));
  const hit=wanted.filter(x=>seen.has(x));
  const pairs=[];
  for(const a of wanted) for(const b of wanted) if(a!==b && seen.has(a) && seen.has(b)) pairs.push(a+"–"+b);
  return {numbers:hit,pairs:[...new Set(pairs)]};
}
function scanRow(row){
  const draws=regionDraws(row), hits=[];
  for(const draw of draws){
    let r=[];
    if(row.type.startsWith("B")) r=resultForB(row,draw);
    else if(row.type==="XC") r=resultForXC(row,draw);
    else if(row.type==="DD") r=resultForDD(row,draw);
    else if(row.type==="DA") r=resultForDA(row,draw);
    if(row.type==="DA"){
      if(r.numbers.length) hits.push({province:drawProvince(draw),date:draw.formatted_date||draw.date,detail:"Số về: "+r.numbers.join(", ")+(r.pairs.length?" • Cặp: "+r.pairs.join(", "):"")});
    }else if(r.length){
      hits.push({province:drawProvince(draw),date:draw.formatted_date||draw.date,detail:r.map(x=>(x.prize||"").toUpperCase()+": "+x.value).join(" • ")});
    }
  }
  return hits;
}
function renderScan(){
  const {rows,errors}=parseBets();
  if(!rows.length){setStatus("Không đọc được phơi để dò.","err");return;}
  let html=`<section class="card"><div class="title">🔎 KẾT QUẢ TỰ DÒ — ${$("date").value}</div>`;
  let totalHits=0;
  for(const row of rows){
    const hits=scanRow(row); totalHits+=hits.length;
    const color=hits.length?"ok":"err";
    html+=`<div class="line ${color}"><b>${row.numbers.join("–")} ${row.type} ${row.points}n</b> — ${hits.length?"TRÚNG":"CHƯA THẤY TRÚNG"}`;
    if(hits.length) html+=`<div class="muted">${hits.map(h=>`${h.province}: ${h.detail}`).join("<br>")}</div>`;
    html+=`</div>`;
  }
  if(errors.length) html+=`<div class="line"><b>Dòng chưa đọc:</b><br>${errors.map(x=>x.replace(/</g,"&lt;")).join("<br>")}</div>`;
  html+=`<div class="total">Tổng dòng có kết quả: ${totalHits}</div></section>`;
  $("out").innerHTML=html;
  setStatus(totalHits?`Đã dò xong: có ${totalHits} dòng có kết quả.`:"Đã dò xong: chưa thấy dòng nào trúng.",totalHits?"ok":"");
}

$("get").onclick=async()=>{
  try{await getAllLotteryResults();}catch(e){setStatus(e.message,"err");}
};
$("scan").onclick=async()=>{
  try{
    if(!lotteryResults.N.length&&!lotteryResults.T.length&&!lotteryResults.B.length) await getAllLotteryResults();
    renderScan();
  }catch(e){setStatus(e.message,"err");}
};

$("calc").onclick=renderCalc;
$("clear").onclick=()=>{$("bets").value="";$("out").innerHTML="";setStatus("Đã xóa.")};
$("date").value=new Date().toISOString().slice(0,10);
syncCustomerSelect();
boot();
</script>
</body>
