<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xác thực phiếu CuncunPrint</title><style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f6f8;margin:0;padding:24px;color:#17202a}
main{max-width:440px;margin:30px auto;background:white;border:1px solid #d9dce2;border-radius:16px;padding:24px}
h1{font-size:23px}#status{font-weight:800;font-size:24px;margin:22px 0}
.ok{color:#117a35}.bad{color:#b3261e}.muted{color:#59636e}
button{padding:14px;border:0;border-radius:8px;background:#b3261e;color:white;font-weight:700;width:100%}
</style></head><body><main>
<h1>XÁC THỰC PHIẾU</h1><p class="muted">CuncunPrint — QR xác thực một lần</p>
<p id="status">Đang kiểm tra…</p><p id="details"></p>
<p class="muted">Quét QR chỉ kiểm tra trạng thái, không tự đánh dấu phiếu đã sử dụng. Việc xác nhận sử dụng yêu cầu đăng nhập chủ phiếu.</p>
</main><script>
(async()=>{
 const status=document.getElementById('status'),details=document.getElementById('details');
 const token=new URL(location.href).searchParams.get('token')||'';
 history.replaceState(null,'',location.pathname);
 if(!/^[a-f0-9]{64}$/.test(token)){status.textContent='QR KHÔNG HỢP LỆ';status.className='bad';return;}
 try{
  const response=await fetch('https://zigpqddlhvjbjrwhfhaa.supabase.co/functions/v1/receipt-verify',{
    method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'check',token})
  });
  const data=await response.json();
  if(!response.ok)throw Error('Không tìm thấy phiếu hoặc máy chủ chưa sẵn sàng');
  status.textContent=data.status==='active'?'PHIẾU CHƯA SỬ DỤNG':data.status==='redeemed'?'PHIẾU ĐÃ SỬ DỤNG':'PHIẾU ĐÃ HỦY';
  status.className=data.status==='active'?'ok':'bad';
  details.textContent='Mã phiếu: '+String(data.receipt_code||'')+(data.redeemed_at?' — Đã sử dụng: '+new Date(data.redeemed_at).toLocaleString('vi-VN'):'');
 }catch(e){status.textContent='CHƯA XÁC THỰC ĐƯỢC';status.className='bad';details.textContent=e.message;}
})();
</script></body></html>
